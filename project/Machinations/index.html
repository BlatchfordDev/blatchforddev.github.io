<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Machinations v4.05 • Patched by BlatchfordDev</title>

  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: #e8eef6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    header {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    
    /* Small icon inside pills */
    header .ico {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 6px;
      vertical-align: -2px;
    }
    header .ico svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* Left side: Projects + Offline Version */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    header a, header .pill {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 8px 10px;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      line-height: 1;
      user-select: none;
      white-space: nowrap;
    }

    #wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The SWF lives inside this container */
    #stage {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    /* Small hint if something fails */
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      padding: 24px;
      box-sizing: border-box;
      font-size: 14px;
      opacity: 0.9;
    }

    #fallback code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 8px;
    }
    
    /* Only the bottom-right build bubble */
    header #info {
      background: rgba(0, 0, 0, 0.35);      /* lower = more transparent */
      border-color: rgba(255, 255, 255, 0.10);
    }
    
    .pill-info {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.10);
    }
  </style>

  <meta name="google" content="notranslate" />

  <!-- Ruffle (Flash Player emulator) -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>

<body>
  <header>
    <div class="nav-left">
      <a href="/">← Projects</a>
      <a class="pill-gh" href="https://github.com/BlatchfordDev/Machinations" target="_blank" rel="noopener noreferrer">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.5 2.9 8.4 6.9 9.7.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.4-3.4-1.4-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 0 1.6 1.1 1.6 1.1.9 1.6 2.4 1.1 3 .9.1-.7.3-1.1.6-1.4-2.2-.3-4.5-1.1-4.5-5a4 4 0 0 1 1-2.8 3.7 3.7 0 0 1 .1-2.7s.9-.3 2.8 1.1a9.3 9.3 0 0 1 5.1 0c1.9-1.4 2.8-1.1 2.8-1.1.6 1.6.2 2.4.1 2.7a4 4 0 0 1 1 2.8c0 3.9-2.3 4.7-4.5 5 .4.3.7 1 .7 2.1v3c0 .3.2.6.7.5 4-1.3 6.9-5.2 6.9-9.7C22 6.6 17.5 2 12 2Z"/>
        </svg>
      </span>
      Offline Version
    </a>
    </div>

    <div class="pill pill-info" id="info">Loading…</div>
  </header>

  <div id="wrap">
    <div id="stage"></div>
  </div>

  <div id="fallback">
    <div style="max-width: 900px; margin: 0 auto;">
      <h2 style="margin: 0 0 10px;">Couldn’t start the SWF</h2>
      <p style="margin: 0 0 10px;">
        Check that <code>auto-scale.swf</code> (and any size SWFs) are in the same folder as this page.
      </p>
      <p style="margin: 0;">
        Open DevTools → Console for details.
      </p>
    </div>
  </div>

  <script>
    // --- Config ---
    const DEFAULT_SWF = "auto-scale.swf";

    // If ?size=1920x1080, this page will try to load:
    //   dleanjeans-1920x1080.swf
    // If the size param doesn't match the expected format, it falls back to DEFAULT_SWF.
    function pickSwfFromQuery() {
      const params = new URLSearchParams(window.location.search);

      // NEW: direct SWF override
      const swfParam = params.get("swf");
      if (swfParam) {
        // basic safety: strip any path, keep filename-ish
        const clean = swfParam.split("/").pop().replace(/[^\w.\-]/g, "");
        if (clean) return { swf: clean, size: null, mode: "swf" };
      }

      // existing ?size=WxH support
      const size = params.get("size");
      if (!size) return { swf: DEFAULT_SWF, size: null, mode: "default" };

      const match = size.match(/^(\d{2,5})x(\d{2,5})$/i);
      if (!match) return { swf: DEFAULT_SWF, size: null, mode: "default" };

      const swf = `dleanjeans-${match[1]}x${match[2]}.swf`;
      return { swf, size: `${match[1]}x${match[2]}`, mode: "size" };
    }

    function setInfo(text) {
      const el = document.getElementById("info");
      if (el) el.textContent = text;
    }

    function showFallback() {
      const fb = document.getElementById("fallback");
      if (fb) fb.style.display = "block";
    }

    (function boot() {
      const stage = document.getElementById("stage");
      if (!stage) return;

      const choice = pickSwfFromQuery();

      // Display the SWF that will be loaded (always)
      setInfo(`build: ${choice.swf} • archived educational software`);

      // Create Ruffle player
      try {
        if (!window.RufflePlayer) {
          setInfo("Ruffle failed to load");
          showFallback();
          return;
        }

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        // Make player fill the stage container
        player.style.width = "100%";
        player.style.height = "100%";

        // Clear stage (in case of hot reloads) and mount player
        stage.innerHTML = "";
        stage.appendChild(player);

        // Load the SWF
        player.load(choice.swf).catch((err) => {
          console.error("SWF load failed:", err);
          setInfo(`Failed → ${choice.swf}`);
          showFallback();
        });

      } catch (err) {
        console.error("Boot failed:", err);
        setInfo("Boot failed (see console)");
        showFallback();
      }
    })();
  </script>
</body>
</html>
